<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>New Famous</title>
</head>
<body>
<div class="container">
    <header>
        <h2>Fast Food</h2>
            <div class="shoppingBasket">
                <i class="fa fa-cart-shopping fa-xl" id="carticon"></i>
                <span class="quantity">0</span>
        </div>
    </header>
<section class="food-banner">
  <div class="banner-overlay">
    <div class="banner-content">
      <h1>CRUNCHY. JUICY. FRESH. 🍟</h1>
      <p>The best fast food in town, delivered straight to your door. Taste the magic in every bite!</p>
      
      <div class="action-row">
        <a href="https://wa.me/YOUR_NUMBER" target="_blank" class="food-action chat-style">
          Chat With Us
        </a>
        <a href="#" class="food-action choice-style">
          Explore Menu
        </a>
      </div>
    </div>
  </div>
</section>


    <div class="search-container">
    <div class="search-box">
        <i class="fa fa-search search-icon"></i>
        <input type="text" class="search-input" placeholder="Search your favorite food..." onkeyup="searchFood()">
    </div>
    </div>
<div class="category-filter-container" id="categoryFilter"></div>

    <div class="products"></div>
</div>
<div class="cartOverlay">
  <div class="cartContent">
    <h1 class="cartTitle">Your Cart</h1>
    <hr>
    <ul class="productList">
      </ul>

    <div class="cartFooter">
      <div class="total">
        <small>Subtotal: </small> <span id="cartTotalText">0</span> Rs
      </div>
      <button type="button" class="checkk" onclick="goToCheckout()">CheckOut</button>
      <button class="close" onclick="toggleCart()">Close</button>
    </div>
  </div>
</div>

<div id="sizeModal" class="modal">
    <div class="modal-content">
        <h3>Select Size 🍕</h3>
        <p id="modalItemName"></p>
        <div id="sizeOptions">
            </div>
        <button class="close-modal" onclick="closeModal()">Cancel</button>
    </div>
</div>

<section class="contact-section" id="contact">
    <h2 class="section-title">Contact Us</h2>
    <div class="contact-container">
        
        <div class="contact-info">
            <div class="info-card">
                <i class="fa fa-map-marker"></i>
                <h3>Our Location</h3>
                <p>123 Street, Karachi, Pakistan</p>
            </div>
            <div class="info-card">
                <i class="fa fa-phone"></i>
                <h3>Call Us</h3>
                <p>+92 303 *******</p>
            </div>
        </div>

<form class="contact-form" id="contactForm">
    <input type="text" id="contactName" placeholder="Your Name" required>
    <input type="email" id="contactEmail" placeholder="Your Email" required>
    <textarea id="contactMessage" placeholder="Your Message" rows="5" required></textarea>
    <button type="button" class="send-btn" onclick="sendToWhatsApp()">Send Message via WhatsApp</button>
</form>

    </div>
    </section>
<script src="https://kit.fontawesome.com/f497a2fd00.js" crossorigin="anonymous"></script>
    <script src="script.js"></script>

</body>
</html>
