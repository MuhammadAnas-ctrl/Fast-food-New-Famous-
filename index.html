<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>New Famous</title>
</head>
<body>
<div class="container">
    <header>
        <h2>Fast Food</h2>
            <div class="shoppingBasket">
                <i class="fa fa-cart-shopping fa-xl" id="carticon"></i>
                <span class="quantity">0</span>
        </div>
    </header>
<section class="hero-section">
  <div class="hero-content">
    <h1>CRUNCHY. JUICY. FAST. 🍔</h1>
    <p>Experience the ultimate flavor explosion with our hand-crafted burgers and golden fries. Made fresh, delivered fast, just for you.</p>
    
    <div class="hero-actions-container">
      <a href="#" class="food-action action-chat">Chat With Us</a>
      <a href="#" class="food-action action-order">Order Now</a>
    </div>
  </div>
</section>

<div class="search-container">
  <div class="search-box">
    <span class="search-emoji">🔍</span>
    <input type="text" class="search-input" placeholder="Find your next favorite book...">
    
  </div>
</div>
    
    <div class="products"></div>
</div>
<div class="cartOverlay">
  <div class="cartContent">
    <h3 class="cartTitle">Your Cart</h3>
    <hr>
    <ul class="productList">
      <!-- Cart items will appear here -->
    </ul>

    <div class="cartFooter">
      <div class="total">
        <small>Subtotal (0 items)</small> ₹0
      </div>
      <button type="button" class="checkk">CheckOut</button>
      <button class="close">Close</button>
    </div>
  </div>
</div>





<script src="https://kit.fontawesome.com/f497a2fd00.js" crossorigin="anonymous"></script>
    <script src="script.js"></script>

</body>
</html>
